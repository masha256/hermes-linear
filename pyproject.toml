# Metadata and test config only. There is deliberately no [build-system] and no
# entry point: Hermes installs this plugin as a directory (plugin.yaml + the
# repo-root __init__.py shim). A [build-system] table makes Hermes's package
# manager treat the file as an install declaration and build the plugin into
# every environment it prepares, even with no dependencies.

[project]
name = "hermes-linear"
version = "0.2.1"
description = "Linear channel (platform) plugin for Hermes Agent"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
# Runtime deps (aiohttp) are supplied by Hermes itself; nothing to install.
dependencies = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
