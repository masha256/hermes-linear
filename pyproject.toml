[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-linear"
version = "0.1.0"
description = "Linear channel (platform) plugin for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
# Runtime deps (aiohttp) are supplied by Hermes itself; nothing to install.
dependencies = []

[project.entry-points."hermes_agent.plugins"]
linear = "hermes_linear.plugin"

[tool.setuptools]
# Only the code package ships; the repo-root __init__.py is the directory-plugin shim.
packages = ["hermes_linear"]

[tool.setuptools.package-data]
hermes_linear = ["skills/*/SKILL.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
